<!doctype html>
<html lang="vi">

    <script>
      // React Fast Refresh preamble for Vite
      window.__vite_plugin_react_preamble_installed__ = true;
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };

      // Suppress harmless Vite dev HMR WebSocket disconnection warning in cloud preview iframe
      (function() {
        if (typeof window === 'undefined') return;
        try {
          if (window.CloseEvent) {
            Object.defineProperty(window.CloseEvent.prototype, 'wasClean', {
              get: function() { return true; },
              configurable: true,
            });
          }
        } catch (e) {}

        const originalError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const msg = String(args[0]?.message || args[0]?.stack || args[0] || '');
            if (msg.includes('WebSocket') || msg.includes("reading 'send'")) {
              return;
            }
          }
          originalError.apply(console, args);
        };

        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args.length > 0) {
            const msg = String(args[0]?.message || args[0]?.stack || args[0] || '');
            if (msg.includes('WebSocket') || msg.includes("reading 'send'")) {
              return;
            }
          }
          originalWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reason = String(event.reason?.message || event.reason || '');
          if (reason.includes('WebSocket') || reason.includes("reading 'send'")) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = String(event.message || event.error?.message || '');
          if (msg.includes('WebSocket') || msg.includes("reading 'send'")) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
